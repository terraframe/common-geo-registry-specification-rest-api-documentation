get:
  tags:
    - Hierarchy
  summary: Get all Hierarchies.
  description: Get all Hierarchies.
  operationId: getHierarchies
  parameters:
    - name: types
      in: query
      description: >-
        A serialized JSON array of hierarchy codes. This example is HTTP URL
        encoded.
      required: false
      schema:
        type: string
      example: '%5B%22ADM_H%22%2C%22Health_geo%22%5D'
    - name: context
      in: query
      description: >-
        Can be either 'READ' or 'WRITE'. If set to WRITE, the system will only
        return hierarchies for which you have permission to write. READ context
        will return all hierarchies that you have permission to read.
      required: true
      schema:
        type: string
        enum:
          - READ
          - WRITE
      example: READ
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/HierarchyType.yaml
          example:
            - code: Test_HF
              label:
                localizedValue: 'Health hierarchy '
                localeValues:
                  - locale: defaultLocale
                    value: Health hierarchy
              description:
                localizedValue: ''
                localeValues:
                  - locale: defaultLocale
                    value: ''
              organizationCode: MOH
              abstractDescription: ''
              progress: ''
              acknowledgement: ''
              contact: ''
              phoneNumber: ''
              email: ''
              accessConstraints: ''
              useConstraints: ''
              rootGeoObjectTypes:
                code: health_facility
                label:
                  localizedValue: Health Facility
                  localeValues:
                    - locale: defaultLocale
                      value: Health Facility
                    - locale: km_KH
                      value: មណ្ឌលសុខភាព
                description: Health facilities for ...
                geometryType: Polygon
                isGeometryEditable: true
                organizationCode: moh
                attributes:
                  - code: uid
                    type: character
                    label:
                      localizedValue: UID
                      localValues:
                        - null
                    description:
                      localizedValue: The internal globally unique identifier ID
                      localeValues:
                        - null
                    isDefault: true
                    required: true
                    isChangeOverTime: false
                  - code: displayLabel
                    type: local
                    label:
                      localizedValue: Display Label
                      localValues:
                        - null
                    description:
                      localizedValue: Label of the location
                      localeValues:
                        - null
                    isDefault: true
                    required: true
                    isChangeOverTime: false
                  - code: code
                    type: character
                    label:
                      localizedValue: Code
                      localValues:
                        - local: defaultLocale
                          value: Code
                    description:
                      localizedValue: Human readable unique identified
                      localeValues:
                        - locale: defaultLocale
                          value: Human readable unique identified
                    isDefault: true
                    required: true
                    isChangeOverTime: false
                  - code: lastUpdateDate
                    type: date
                    label:
                      localizedValue: Date Last Updated
                      localValues:
                        - null
                    description:
                      localizedValue: The date the object was updated
                      localeValues:
                        - null
                    isDefault: true
                    required: false
                    isChangeOverTime: false
                  - code: createDate
                    type: date
                    label:
                      localizedValue: Date Created
                      localValues:
                        - null
                    description:
                      localizedValue: The date the object was created
                      localeValues:
                        - null
                    isDefault: true
                    required: false
                    isChangeOverTime: false
                  - code: type
                    type: character
                    label:
                      localizedValue: Type
                      localValues:
                        - null
                    description:
                      localizedValue: The type of the Geo-Object
                      localeValues:
                        - null
                    isDefault: true
                    required: false
                    isChangeOverTime: false
                  - code: sequence
                    type: integer
                    label:
                      localizedValue: Sequence
                      localValues:
                        - null
                    description:
                      localizedValue: >-
                        The sequence number of the Geo-Object that is
                        incremented when the object is updated
                      localeValues:
                        - null
                    isDefault: true
                    required: false
                    isChangeOverTime: false
                  - code: status
                    type: term
                    label:
                      localizedValue: Status
                      localValues:
                        - local: defaultLocale
                          value: Status
                    description:
                      localizedValue: The status of the Geo-Object
                      localeValues:
                        - local: defaultLocale
                          value: The status of the Geo-Object
                    isDefault: true
                    required: true
                    isChangeOverTime: true
                    rootTerm:
                      code: 'CGR:Status-Root'
                      label:
                        localizedValue: Geo-Object Status
                        localeValues:
                          - null
                      description:
                        localizedValue: >-
                          The status of a Geo-Object changes during the
                          governance lifecycle.
                        localValues:
                          - null
                      children:
                        - code: 'CGR:Status-New'
                          label:
                            localizedValue: New
                            localeValues:
                              - null
                          description:
                            localizedValue: >-
                              A newly created Geo-Object that has not been
                              submitted for approval.
                            localValues:
                              - null
                              - code: 'CGR:Status-Active'
                                label:
                                  localizedValue: Active
                                  localeValues:
                                    - null
                                description:
                                  localizedValue: The Geo-Object is a part of the master list.
                                  localValues:
                                    - null
                                    - code: 'CGR:Status-Pending'
                                      label:
                                        localizedValue: Pending
                                        localeValues:
                                          - null
                                      description:
                                        localizedValue: >-
                                          Edits to the GeoObject are pending
                                          approval.
                                        localValues:
                                          - null
                                          - code: 'CGR:Status-Inactive'
                                            label:
                                              localizedValue: Inactive
                                              localeValues:
                                                - null
                                            description:
                                              localizedValue: >-
                                                The object is not considered a source of
                                                truth.
                                              localValues:
                                                - null
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Not found
