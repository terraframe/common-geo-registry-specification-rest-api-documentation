get:
  tags:
    - Geo-Object Type
  summary: Return GeoOjectType objects that define the given list of types.
  description: Return GeoOjectType objects that define the given list of types.
  operationId: getGeoObjectTypes
  parameters:
    - name: types
      in: query
      description: >-
        An array of Geo-Object Type codes. If blank then all Geo-Object Type
        objects are returned. Example is encoded for easy texting in a web
        browser.
      required: false
      schema:
        type: array
        items:
          type: string
      example: '%5B%22PRO%22%5D'
    - name: hierarchies
      in: query
      description: >-
        An array of Hierarchy codes. If blank then all Hierarchy objects are
        returned. Example is encoded for easy texting in a web browser.
      required: false
      schema:
        type: array
        items:
          type: string
      example: '%5B%22ADM_H%22%5D'
  # security:
  #   - main_auth:
  #       - 'read:users'
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/GeoObjectType.yaml
          example:
            - code: health_facility
              label:
                localizedValue: Health Facility
                localeValues:
                  - locale: defaultLocale
                    value: Health Facility
                  - locale: km_KH
                    value: មណ្ឌលសុខភាព
              description: Health facilities for ...
              geometryType: MultiPolygon
              isGeometryEditable: true
              organizationCode: moh
              superTypeCode: ''
              attributes:
                - code: uid
                  type: character
                  label:
                    localizedValue: UID
                    localValues:
                      - null
                  description:
                    localizedValue: The internal globally unique identifier ID
                    localeValues:
                      - null
                  isDefault: true
                  required: false
                  unique: false
                  isChangeOverTime: false
                - code: displayLabel
                  type: local
                  label:
                    localizedValue: Display Label
                    localValues:
                      - null
                  description:
                    localizedValue: Label of the location
                    localeValues:
                      - null
                  isDefault: true
                  required: false
                  unique: false
                  isChangeOverTime: false
                - code: code
                  type: character
                  label:
                    localizedValue: Code
                    localValues:
                      - local: defaultLocale
                        value: Code
                  description:
                    localizedValue: Human readable unique identified
                    localeValues:
                      - locale: defaultLocale
                        value: Human readable unique identified
                  isDefault: true
                  required: false
                  unique: false
                  isChangeOverTime: false
                - code: lastUpdateDate
                  type: date
                  label:
                    localizedValue: Date Last Updated
                    localValues:
                      - null
                  description:
                    localizedValue: The date the object was updated
                    localeValues:
                      - null
                  isDefault: true
                  required: false
                  unique: false
                  isChangeOverTime: false
                - code: createDate
                  type: date
                  label:
                    localizedValue: Date Created
                    localValues:
                      - null
                  description:
                    localizedValue: The date the object was created
                    localeValues:
                      - null
                  isDefault: true
                  required: false
                  unique: false
                  isChangeOverTime: false
                - code: type
                  type: character
                  label:
                    localizedValue: Type
                    localValues:
                      - null
                  description:
                    localizedValue: The type of the Geo-Object
                    localeValues:
                      - null
                  isDefault: true
                  required: false
                  isChangeOverTime: false
                - code: sequence
                  type: integer
                  label:
                    localizedValue: Sequence
                    localValues:
                      - null
                  description:
                    localizedValue: >-
                      The sequence number of the Geo-Object that is incremented
                      when the object is updated
                    localeValues:
                      - null
                  isDefault: true
                  required: false
                  unique: false
                  isChangeOverTime: false
              permissions:
                - CREATE
                - READ
                - DELETE
                - WRITE
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Not found
