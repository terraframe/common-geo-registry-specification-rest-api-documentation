get:
  tags:
    - Organization
  summary: Get all Organizations
  description: Get all Organizations
  operationId: getAllOrganizations
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Organization.yaml
