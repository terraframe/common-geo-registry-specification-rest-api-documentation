post:
  tags:
    - Geo-Object
  summary: Create an empty Geo-Object.
  description: Create an empty Geo-Object.
  operationId: createNewGeoObjectInstance
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/TypeCodeBody.yaml
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            oneOf:
              - $ref: ../components/schemas/GeoObject.yaml
              - $ref: ../components/schemas/RevealGeoObject.yaml
            discriminator:
              propertyName: format
              mapping:
                JSON_CGR: ../components/schemas/GeoObject.yaml
                JSON_REVEAL: ../components/schemas/RevealGeoObject.yaml
          examples:
            JSON_CGR:
              summary: Standard CGR GeoObject response
              value:
                type: Feature
                id: 9975976c-1243-478c-850b-9176e2a7f57e
                geometry:
                  type: MultiPoint
                  coordinates:
                    - 113.56111706249908
                    - 0.0657243021884568
                properties:
                  uid: 9975976c-1243-478c-850b-9176e2a7f57e
                  code: sflsjdflldsfj
                  type: health_facilities
                  lastUpdateDate: 1592514228000
                  createDate: 1592426785000
                  displayLabel:
                    localizedValue: Central Health Facility
                    localeValues:
                      - locale: defaultLocale
                        value: Central Health Facility
                  invalid: false
                  exists: true
                  writable: true

            JSON_REVEAL:
              summary: Reveal format response
              value:
                type: Feature
                id: 9975976c-1243-478c-850b-9176e2a7f57e
                geometry:
                  type: MultiPoint
                  coordinates:
                    - 113.56111706249908
                    - 0.0657243021884568
                properties:
                  status: Active
                  name: Central Health Facility
                  version: 0
                  externalId: 999999
                  parentId: 63160720-239c-4347-ae93-b89ab781602d
                geographiLevel: 2
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Not found
