post:
  tags:
    - Geo-Object Type
  summary: >-
    Import GeoObject-Type, Hierarchy Type, Directed Acyclic Graph Type, Undirect
    Graph Type definitions from an XML file.
  description: >-
    Import GeoObject-Type, Hierarchy Type, Directed Acyclic Graph Type, Undirect
    Graph Type definitions from an XML file.
  operationId: importTypes
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          properties:
            file:
              type: string
              format: binary
            orgCode:
              type: string
              example: MOHA
  security:
    - main_auth:
        - 'read:users'
  responses:
    '200':
      description: Success
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Not found
