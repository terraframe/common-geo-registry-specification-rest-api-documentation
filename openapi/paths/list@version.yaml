get:
  tags:
    - List
  summary: Get the list type version for a list type entry.
  description: >-
    Get the list type version for a list type entry. A list type version
    contains all the metadata for a list. See list-type/data for an endpoint
    that returns the instance data of a list. List configurations contain list
    entries which contain list versions.
  operationId: version
  parameters:
    - name: oid
      in: query
      description: Object ID of the List Type version.
      required: true
      schema:
        type: string
      example: df63be86-f4ba-4616-83de-ee6df70007cc
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/ListTypeVersion.yaml
          example:
            oid: df63be86-f4ba-4616-83de-ee6df70007cc
            displayLabel: Health facility master list and geographic coordinates
            typeCode: Health_facility
            orgCode: MOH
            listType: 117cca3c-bb8c-467d-bba0-bada110007de
            forDate: '2022-01-01'
            createDate: '2022-11-09'
            versionNumber: 1
            working: false
            geometryType: MULTIPOINT
            isGeometryEditable: true
            isAbstract: true
            shapefile: false
            isMember: false
            period:
              type: date
              value: '2022-01-01'
            listMetadata:
