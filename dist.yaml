  /api/list-type/data:
    get:
      tags:
        - List
      summary: Get list data in list format.
      description: >-
        Return list data in list format where an array contans one object per
        row of the List. Each attribute (column value) in the array is a key
        value pair where the key is the name of the column and the value is the
        value.
      operationId: data
      parameters:
        - name: oid
          in: query
          description: OID of the list.
          required: true
          schema:
            type: string
          example: 11fa9757-d887-461e-93f0-044be80005f1
        - name: criteria
          in: query
          description: Filtering criteria of the data.
          required: true
          schema:
            type: object
            properties:
              first:
                type: integer
                description: Row number to start the response from. Used with pagination.
              rows:
                type: integer
                description: >-
                  How many rows to include in the response. Used with
                  pagination.
              sortField:
                type: string
                description: >-
                  Field to sort on. You can use multiSortOrder instead of this
                  parameter.
              sortOrder:
                type: integer
                description: >-
                  Sort oder for the sortField. 1 is ascending and -1 is
                  descending. You can use multiSortOrder instead of this
                  parameter.
              multiSortMeta:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      description: code of the field to sort on.
                    order:
                      type: integer
                      description: >-
                        Sort oder for the sortField. 1 is ascending and -1 is
                        descending.
              filters:
                type: array
                items:
                  type: object
                  properties:
                    matchMode:
                      type: string
                      description: >-
                        Strategy for matching field values. Options for Text
                        types can utilize "contains" or "equals". Options for
                        Boolean types must use "". Options for number types
                        (integer or decimal) must use "equals". Options for Date
                        types must use "{startDate:string, endDate:string}".
                    value:
                      type: string
                      description: Value to filter on.
          example: >-
            {filters: {code: {matchMode: "equals", value: "02"}}, first: 0,
            multiSortMeta: [{field: "code", order: -1}], rows: 30, sortOrder: 1}
        - name: showInvalid
          in: query
          description: Option to include invalid Geo-Objects.
          required: true
          schema:
            type: boolean
            default: false
          example: true
        - name: includeGeometries
          in: query
          description: Option to include geometries for each row (when they exist).
          required: false
          schema:
            type: boolean
            default: false
          example: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/List'
              example:
                - geometry:
                    type: MultiPoint
                    coordinates:
                      - - 120.99056
                        - 14.39887
                  originalOid: 24a0cb9e-8d6b-4387-bd3b-dcbd05c8aea2
                  education_geocty: TLK0401
                  HD_NA_EN: Nataly Vasquez
                  code: SC0001
                  SC_TDefaultLocale: University
                  COOR_ACU: COA4
                  education_georeg: TLK
                  education_geoproDefaultLocale: Mittalmar
                  education_geoshrDefaultLocale: Centro
                  SC_T: ST2
                  education_geoshr: TLK0401002
                  LD_NBR_G: +99 96 98765432
                  education_geopro: TLK04
                  displayLabelDefaultLocale: Tolkien University
                  COOR_ACUDefaultLocale: High
                  invalid: false
                  education_georegDefaultLocale: Tolkien Region
                  SC_OWNDefaultLocale: Ministry of Education
                  education_geoctyDefaultLocale: Armenelos
                  HD_PS_EN: Director
                  SC_OWN: SO2
                  SOUR_COORDefaultLocale: MOE (GPS)
                  SOUR_COOR: SOC2
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
