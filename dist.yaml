          $ref: '#/components/schemas/LocalizedLabel'
    AddGraphChildBody:
      type: object
      description: Add child params.
      properties:
        parentCode:
          type: string
        parentTypeCode:
          type: string
        childCode:
          type: string
        childTypeCode:
          type: string
        directedGraphCode:
          type: string
        startDate:
          type: string
        endDate:
          type: string
    RemoveGraphChildBody:
      type: object
      description: Remove Directed Graph Relationship child params.
      properties:
        parentCode:
          type: string
        parentTypeCode:
          type: string
        childCode:
          type: string
        childTypeCode:
          type: string
        directedGraphCode:
          type: string
        startDate:
          type: string
        endDate:
          type: string
    RelatedType:
      type: object
      description: Defines a undirected relationship type.
      properties:
        code:
          type: string
        label:
          $ref: '#/components/schemas/LocalizedLabel'
        description:
          $ref: '#/components/schemas/LocalizedLabel'
        organizationCode:
          type: string
    AddRelatedGeoObjectBody:
      type: object
      description: Add child params.
      properties:
        sourceCode:
          type: string
        sourceTypeCode:
          type: string
        targetCode:
          type: string
        targetTypeCode:
          type: string
        undirectedRelationshipCode:
          type: string
        startDate:
          type: string
        endDate:
          type: string
    RemoveRelatedGeoObjectBody:
      type: object
      description: Remove related Geo-Object params.
      properties:
        sourceCode:
          type: string
        sourceTypeCode:
          type: string
        targetCode:
          type: string
        targetTypeCode:
          type: string
        undirectedRelationshipCode:
          type: string
        startDate:
          type: string
        endDate:
          type: string
    Organization:
      type: object
      properties:
        code:
          type: string
        label:
          $ref: '#/components/schemas/LocalizedLabel'
        contactInfo:
          $ref: '#/components/schemas/LocalizedLabel'
    TypeAndCode:
      type: object
      description: Add child params.
      properties:
        type:
          type: string
          enum:
            - GEO_OBJECT
            - HIERARCHY
            - DAG
            - UNDIRECTED
            - BUSINESS
            - BUSINESS_EDGE
          example: GEO_OBJECT
        code:
          type: string
          example: USATestDataCountry
    Publish:
      type: object
      description: Defines data to publish.
      properties:
        uid:
          type: string
          description: Globally unique uid of the published graph
          example: a15afe34-d789-407e-8aba-5055149c439e
        date:
          type: string
          format: date
          description: The date to use when determing values of the published graph
          example: '2020-04-04'
        startDate:
          type: string
          format: date
          description: The start date of the period of validity for the published graph
          example: '2020-04-04'
        endDate:
          type: string
          format: date
          description: The end date of the period of validity for the published graph
          example: '2021-04-04'
        origin:
          type: string
          example: https://demo-georegistry.geoprism.net/
        types:
          type: array
          items:
            $ref: '#/components/schemas/TypeAndCode'
          description: >-
            List of (type, code) pairings of the repository types to include in
            the published graph
        exclusions:
          type: array
          items:
            $ref: '#/components/schemas/TypeAndCode'
          description: >-
            List of (type, code) pairings of the repository types to exclude
            from the published graph.  This can only be used when the types in
            the graph overlap with the types in a different graph with the same
            period of validity.
    Commit:
      type: object
      description: Defines data to publish.
      properties:
        uid:
          type: string
          example: d02047a4-72e2-4e0d-b447-1b64d2b125c7
        publishId:
          type: string
          example: a15afe34-d789-407e-8aba-5055149c439e
        versionNumber:
          type: integer
          format: int32
          example: 1
        lastOriginGlobalIndex:
          type: integer
          format: int32
          example: 8806
    AttributeTypeSnapshot:
      type: object
      description: Attribute metadata snapshot
      properties:
        code:
          type: string
          example: code
          description: Unique identifier/name of the attribute
        type:
          type: string
          example: character
          description: Attribute type
        label:
          $ref: '#/components/schemas/LocalizedLabel'
        description:
          $ref: '#/components/schemas/LocalizedLabel'
        isDefault:
          type: boolean
          example: true
          description: Flag indicating if the attribute is a default attribute of the GPR
        required:
          type: boolean
          example: false
          description: Flag indicating is the attribute value is required
        unique:
          type: boolean
          example: false
          description: Flag indicating is the attribute value must be unique
        isChangeOverTime:
          type: boolean
          example: true
          description: Flag indicating is the attribute value will change over time
    BusinessTypeSnapshot:
      type: object
      description: Business type metadata snapshot
      properties:
        code:
          type: string
          example: POPULATION
          description: Globally unique identifier of the business type metadata
        orgCode:
          type: string
          example: MOHA
          description: Organization responsible for the metadata definition
        origin:
          type: string
          example: https://demo-georegistry.geoprism.net/
          description: Origin of the metadata
        sequence:
          type: integer
          format: int32
          example: 0
          description: Change sequence number of the metadata
        labelAttribute:
          type: string
          example: null
          description: >-
            Default attribute to use when displaying a label of an instance
            business object
        displayLabel:
          $ref: '#/components/schemas/LocalizedLabel'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeTypeSnapshot'
          description: List of attribute metadata
    GeoObjectTypeSnapshot:
      type: object
      description: Geo object type metadata snapshot
      properties:
        code:
          type: string
          example: HealthCenter
          description: Globally unique identifier of the geo object type metadata
        orgCode:
          type: string
          example: MOHA
          description: Organization responsible for the metadata definition
        origin:
          type: string
          example: https://demo-georegistry.geoprism.net/
          description: Origin of the metadata
        sequence:
          type: integer
          format: int32
          example: 0
          description: Change sequence number of the metadata
        displayLabel:
          $ref: '#/components/schemas/LocalizedLabel'
        geometryType:
          type: string
          example: MULTIPOLYGON
          description: Geometry type
        isAbstract:
          type: boolean
          description: Flag indicating if the type is abstract
        isRoot:
          type: boolean
          description: >-
            Flag indicating if the type is the root type placeholder of the
            graph
        isPrivate:
          type: boolean
          description: Flag indicating if the type is private to the organization
        parent:
          type: string
          example: HealthFacility
          description: Optional code of the parent type from which this type inherits
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeTypeSnapshot'
          description: List of attribute metadata
    HierarchyTypeNodeSnapshot:
      type: object
      description: >-
        A tree node describing the structure of Geo Object Types participating
        in the hierarchy
      properties:
        code:
          type: string
          example: HealthCenter
          description: Code of a Geo Object Type
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/HierarchyTypeNodeSnapshot'
    HierarchyTypeSnapshot:
      type: object
      description: Snapshot of Hierarchy Type metadata
      properties:
