components:
  securitySchemes:
    Basic Authentication:
      type: http
      scheme: basic
      description: >-
        GeoPrism Registry uses basic authentication over HTTPS. To authenticate
        against the API you must include a base64 encoded hash in the request
        header. A simple way to create the hash is to encode the username and
        password of an existing user as username:password using a tool like
        https://www.base64encode.org/.
  schemas:
    MultiPoint:
      type: array
      required:
        - type
      externalDocs:
        url: http://geojson.org/geojson-spec.html#geometry-objects
      items:
        type: array
        items:
          type: number
    MultiPolygon:
      type: array
      required:
        - type
      externalDocs:
        url: http://geojson.org/geojson-spec.html#geometry-objects
      items:
        type: array
        items:
          type: number
    MultiLine:
      type: array
      required:
        - type
      externalDocs:
        url: http://geojson.org/geojson-spec.html#geometry-objects
      items:
        type: array
        items:
          type: number
    Geometry:
      type: object
      description: GeoJson geometry
      required:
        - type
      externalDocs:
        url: http://geojson.org/geojson-spec.html#geometry-objects
      properties:
        type:
          type: string
          enum:
            - MultiPoint
            - MultiLineString
            - MultiPolygon
        coordinates:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/MultiPoint'
              - $ref: '#/components/schemas/MultiPolygon'
              - $ref: '#/components/schemas/MultiLine'
    LocalizedLabel:
      type: object
      properties:
        localizedValue:
          type: string
          example: Object Label
        localeValues:
          type: array
          items:
            type: object
            properties:
              locale:
                type: string
                example: en
              value:
                type: string
                example: Object Label
    AttributeType:
      type: object
      properties:
        code:
          type: string
        localizedLabel:
          type: string
        type:
          type: string
        description:
          $ref: '#/components/schemas/LocalizedLabel'
    GeoObjectType:
      type: object
      properties:
        code:
          type: string
        label:
          $ref: '#/components/schemas/LocalizedLabel'
        geometryType:
          type: string
        isGeometryEditable:
          type: boolean
        isPrivate:
          type: boolean
        organizationCode:
          type: string
        superTypeCode:
          type: string
        description:
          $ref: '#/components/schemas/LocalizedLabel'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeType'
        permissions:
          type: array
          items:
            type: string
    DisplayLabel:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        values:
          type: array
          items:
            type: object
            properties:
              startDate:
                type: string
              endDate:
                type: string
              value:
                type: array
                items:
                  $ref: '#/components/schemas/LocalizedLabel'
    Feature:
      type: object
      description: >-
        GeoJSON Feature. Reference -
        https://tools.ietf.org/html/rfc7946#section-3.2
      required:
        - type
        - id
        - geometry
        - properties
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946
      properties:
        type:
          type: string
          enum:
            - Feature
        id:
          type: string
        geometry:
          $ref: '#/components/schemas/Geometry'
        properties:
          type: object
          required:
            - uid
            - code
            - type
            - status
          properties:
            uid:
              type: string
            code:
              type: string
            type:
              $ref: '#/components/schemas/GeoObjectType'
            invalid:
              type: boolean
            exists:
              type: boolean
            writable:
              type: boolean
            displayLabel:
              $ref: '#/components/schemas/DisplayLabel'
            lastUpdateDate:
              type: string
            createDate:
              type: string
            status:
              type: string
    RevealGeoObject:
      type: object
      description: >-
        GeoJSon Feature. Reference -
        https://tools.ietf.org/html/rfc7946#section-3.2
      required:
        - type
        - id
        - geometry
        - properties
      externalDocs:
        url: https://tools.ietf.org/html/rfc7946
      properties:
        type:
          type: string
          enum:
            - Feature
        id:
          type: string
        geometry:
          $ref: '#/components/schemas/Geometry'
        properties:
          type: object
          required:
            - uid
            - code
            - type
            - status
          properties:
            status:
              type: string
            name:
              type: string
            version:
              type: integer
            OpenMRS_Id:
              type: integer
            externalId:
              type: string
            name_en:
              type: string
            geographiLevel:
              type: integer
            parentId:
              type: string
    TypeCodeBody:
      type: object
      description: Geo-Object Type code.
      properties:
        typeCode:
          type: string
    ChildTreeNode:
      type: object
      description: Add child params.
      properties:
