openapi: 3.0.2
info:
  version: 1.0.0
  license:
    name: GPL
    url: https://opensource.org/licenses/gpl-license
  contact:
    name: TerraFrame
    url: https://www.terraframe.com/
    email: info@terraframe.com
  title: GeoPrism Registry REST API
  x-logo:
    url: ./cgr_logo.png
  description: |
    The GeoPrism Registry API provides programatic access to core functionality.
externalDocs:
  description: User documentation
  url: https://terraframe-inc.gitbook.io/geoprism-registry-documentation
tags:
  - name: Organization
    description: Operations to interact with Organization definitions.
  - name: Geo-Object Type
    description: Operations to interact with Geo-Object Types.
  - name: Hierarchy
    description: Operations to interact with Hierarchical relationship type definitions.
  - name: Directed Acyclic Graph
    description: Operations to interact with Directed Acyclic Graph Type definitions.
  - name: Undirected Graph
    description: Operations to interact with Undirected Graph Type definitions.
  - name: Geo-Object
    description: >-
      Operations to interact with Geo-Objects. A Geo-Object represents the most
      current version of the object while Geo-Object-Over-Time has values for
      all available time ranges.
  - name: Geo-Object-Over-Time
    description: >-
      Operations to interact with Geo-Objects-Over-Time. A Geo-Object represents
      the most current version of the object while Geo-Object-Over-Time has
      values for all available time ranges.
  - name: Geo-Object Type
    description: Operations to interact with Geo-Object Types.
  - name: Hierarchy
    description: Operations to interact with hierarchies.
  - name: List
    description: Operations to interact with Lists.
  - name: ETL
    description: Operations for bulk importing data.
  - name: Publish Graph
    description: Operations for publishing and pulling graph data.
servers:
  - url: https://demo-georegistry.geoprism.net
paths:
  /api/geoobject/get:
    get:
      tags:
        - Geo-Object
      summary: Get a Geo-Object by ID for a given Geo-Object Type.
      description: Get all Geo-Objects for a given Geo-Object Type.
      operationId: getGeoObject
      parameters:
        - name: id
          in: query
          description: The id of the Geo-Object to get.
          required: true
          schema:
            type: string
          example: b011c739-7c8f-45ec-8963-a4b61f7edaae
        - name: typeCode
          in: query
          description: The code of the Geo-Object Type the Geo-Object belongs to.
          required: true
          schema:
            type: string
          example: PRO
        - name: date
          in: query
          description: >-
            The date in UTC. Defaults to 5000-12-31 which represents the most
            current date possible.
          required: false
          schema:
            type: string
            default: '5000-12-31'
          example: '2016-04-20'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Feature'
                  - $ref: '#/components/schemas/RevealGeoObject'
              examples:
                JSON_CGR:
                  value:
                    type: Feature
                    geometry:
                      type: MultiPoint
                      coordinates:
                        - - 113.56111706249908
                          - 0.0657243021884568
                    properties:
                      uid: 9975976c-1243-478c-850b-9176e2a7f57e
                      code: sflsjdflldsfj
                      type: health_facilities
                      lastUpdateDate: 1592514228000
                      createDate: 1592426785000
                      displayLabel:
                        localizedValue: Central Health Facility
                        localeValues:
                          - locale: defaultLocale
                            value: Central Health Facility
                          - locale: km_KH
                            value: ជាំ សាងុំា
                      invalid: false
                      exists: true
                      writable: true
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/geoobject/get-all:
    get:
      tags:
        - Geo-Object
      summary: Get all Geo-Objects for a given Geo-Object Type and Hierarchy.
      description: Get all Geo-Objects for a given Geo-Object Type and Hierarchy.
      operationId: getAllGeoObject
      parameters:
        - name: typeCode
          in: query
          description: The code of the Geo-Object Type that defines the Geo-Objects.
          required: true
          schema:
            type: string
          example: PRO
        - name: hierarchyCode
          in: query
          description: >-
            The code of the Hierarchy that the Geo-Object Type belongs to.
            Default is FALSE.
          required: true
          schema:
            type: string
          example: ADM_H
        - name: externalSystemId
          in: query
          description: The id of the external system registered in the CGR.
          required: false
          schema:
            type: string
          example: REVEALEXTSYSTEM
        - name: includeGeographicLevel
          in: query
          description: >-
            TRUE to return the level in the hierarchy the Geo-ObjectType
            resides.
          required: false
          schema:
            type: boolean
            default: false
          example: true
        - name: updatedSince
          in: query
          description: >-
            Date in UTC from wich only Geo-Objects will returned that have been
            updated. 0 represents the beginning of UTC time.
          required: false
          schema:
            type: string
            default: 0
          example: 0
        - name: format
          in: query
          description: Format in which to return the Geo-Objects. Default is JSON_CGR.
          required: false
          schema:
            type: string
            enum:
              - JSON_REVEAL
              - JSON_CGR
            default: JSON_CGR
          example: JSON_REVEAL
        - name: pageNumber
          in: query
          description: Page number used for pagination.
          required: true
          schema:
            type: integer
            default: 1
          example: 1
        - name: pageSize
          in: query
          description: Page size (number or results to return) used for pagination.
          required: true
          schema:
            type: integer
            default: 100
          example: 20
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Feature'
                  - $ref: '#/components/schemas/RevealGeoObject'
              examples:
                JSON_CGR:
                  value:
                    - type: Feature
                      geometry:
                        type: MultiPoint
                        coordinates:
                          - 113.56111706249908
                          - 0.0657243021884568
                      properties:
                        uid: 9975976c-1243-478c-850b-9176e2a7f57e
                        code: sflsjdflldsfj
                        type: health_facilities
                        lastUpdateDate: 1592514228000
                        createDate: 1592426785000
                        displayLabel:
                          localizedValue: Central Health Facility
                          localeValues:
                            - locale: defaultLocale
                              value: Central Health Facility
                            - locale: km_KH
                              value: ជាំ សាងុំា
                        invalid: false
                        exists: true
                        writable: true
                JSON_REVEAL:
                  value:
                    - type: Feature
                      geometry:
                        type: MultiPoint
                        coordinates:
                          - 113.56111706249908
                          - 0.0657243021884568
                      properties:
                        uid: 9975976c-1243-478c-850b-9176e2a7f57e
                        code: sflsjdflldsfj
                        type: health_facilities
                        name: Central Health Facility
                        name_en: Central Health Facility
                        version: 0
                        OpenMRS_Id: 0
                        externalId: 999999
                        parentId: 63160720-239c-4347-ae93-b89ab781602d
                        geographiLevel: 2
                        lastUpdateDate: 1592514228000
                        createDate: 1592426785000
                        status: Active
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/geoobject/put:
    post:
      tags:
        - Geo-Object
      summary: Update a Geo-Object.
