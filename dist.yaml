  /api/geoobject-time/get-code:
    get:
      tags:
        - Geo-Object-Over-Time
      summary: Get a Geo-Object Over Time by code for a given Geo-Object Type.
      description: Get a Geo-Object Over Time by code for a given Geo-Object Type.
      operationId: getGeoObjectOverTimeByCode
      parameters:
        - name: code
          in: query
          description: The code of the Geo-Object to get.
          required: true
          schema:
            type: string
          example: TLK01
        - name: typeCode
          in: query
          description: The code of the Geo-Object Type the Geo-Object belongs to.
          required: true
          schema:
            type: string
          example: PRO
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoObjectOverTime'
              example:
                attributes:
                  displayLabel:
                    name: displayLabel
                    type: local
                    values:
                      - startDate: '2000-01-01'
                        endDate: '2020-10-31'
                        value:
                          localizedValue: older label
                          localeValues:
                            - locale: defaultLocale
                              value: older label
                            - locale: km_KH
                              value: ជាំ សាងុំា
                      - startDate: '2020-11-01'
                        endDate: '5000-12-31'
                        value:
                          localizedValue: new label
                          localeValues:
                            - locale: defaultLocale
