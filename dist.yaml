          description: Origin of the metadata
        sequence:
          type: integer
          format: int32
          example: 0
          description: Change sequence number of the metadata
        displayLabel:
          $ref: '#/components/schemas/LocalizedLabel'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/HierarchyTypeNodeSnapshot'
          description: List of Geo Object types in the hierarchy
    DirectedAcyclicGraphTypeSnapshot:
      type: object
      description: Snapshot of Directed Acyclic Graph Type metadata
      properties:
