      summary: >-
        Create relationships between Geo-Objects for a specific relationship
        type.
      description: >-
        Create relationships between Geo-Objects for a specific relationship
        type.
      operationId: importEdgeJson
      security:
        - Basic Authentication:
            - Super Registry Administrator
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                startDate:
                  type: string
                endDate:
                  type: string
                file:
                  type: string
                  format: binary
                  description: |
                    Schema Example:

                    {graphTypes": [ 
                      {
                        "graphTypeClass": "net.geoprism.registry.UndirectedGraphType",
                        "code": "AdjacentTo",
                        "edges": [
                          {
                            "source": "06S4",
                            "sourceType": "Structure",
                            "target": "11PS",
                            "targetType": "Structure"
                          }
                        ]
                      }
                    ]}
            example:
              startDate: '2000-10-31'
              endDate: '2020-10-31'
              file: <binary>
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
